# Continuous integration: checks every push to main and every pull request.
# It does not build or release the app. Builds stay manual (npx eas-cli@latest build ...)
# so each one is a deliberate release and doesn't use up EAS build credits.
# GitHub emails you when a run fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Package versions match the Expo SDK
        run: npx expo install --check

      - name: Expo project health
        run: npx expo-doctor

      - name: Known security issues in app dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Production JS bundle builds (Android)
        run: npx expo export --platform android --output-dir dist
